name: Userscript CI & Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'shuakejiang.user.js'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Userscript
        run: |
          node scripts/build.js

      - name: Check Build Sync
        run: |
          git diff --exit-code shuakejiang.user.js || (echo "❌ shuakejiang.user.js 与 src/ 源码不一致，请在提交前执行 npm run build！" && exit 1)

      - name: Run Quality Tests
        run: |
          npm test

